# Конфигурация брокера пилота. Каждая директива объяснена в README.MD.
# Файл только для чтения с хоста. Пароли здесь не хранятся.

# Слушать все интерфейсы контейнера, только IPv4. С хоста порт открывает docker compose.
listener 1883
protocol mqtt
socket_domain ipv4

# Без имени и пароля соединение отклоняется. Иначе ACL не применяется к анонимам.
allow_anonymous false

# Оба файла лежат в томе, который entrypoint собирает при старте.
# Исходный ACL — deploy/mosquitto/acl; в том он копируется с владельцем mosquitto и правами 600.
# Пароли собираются из .env и clients.extra.
password_file /mosquitto/passwd/passwd
acl_file /mosquitto/passwd/acl

# Очередь QoS 1 и сессии clean_session=false переживают рестарт процесса.
persistence true
persistence_location /mosquitto/data/
autosave_interval 300
autosave_on_changes false

# Сессия клиента, который больше не подключается, удаляется через 7 дней.
# Суффикс d — дни. Суффикс m у этой директивы означает месяцы, не минуты.
persistent_client_expiration 7d

# Журнал только в stdout: его забирает `docker compose logs`.
# Отдельный файл не пишем, чтобы не упираться в права на каталог логов.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Весь MQTT-пакет больше 10 МиБ обрывает соединение.
# С Mosquitto 2.1 значение по умолчанию — 2 МиБ, для нескольких длинных рядов этого мало.
max_packet_size 10485760

# Сколько сообщений QoS 1/2 одновременно «в полёте» одному клиенту.
max_inflight_messages 20

# Сколько QoS 1/2 держать для отключённого клиента с постоянной сессией.
max_queued_messages 1000

# Меньше задержка коротких JSON.
set_tcp_nodelay true

# 0 — не ограничивать keepalive сверху.
# Ненулевое значение для MQTT 3.1.1 отклоняет клиентов с большим keepalive.
max_keepalive 0

# Как часто обновлять внутренние счётчики $SYS, если к ним кто-то допущен ACL.
sys_interval 10

# TLS выключен. Пароль по порту 1883 передаётся открытым текстом.
# Чтобы включить, положите сертификаты, уберите комментарии и пробросьте 8883 в compose.
# listener 8883
# protocol mqtt
# socket_domain ipv4
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# cafile /mosquitto/certs/ca.crt
# tls_version tlsv1.2
# require_certificate false
